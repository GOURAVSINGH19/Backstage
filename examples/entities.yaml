---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# Infrastructure platform system — owns all clusters, namespaces, ingresses, gateways
# registered via the Scaffolder templates (addcluster-backend plugin).
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: infrastructure-platform
  title: Infrastructure Platform
  description: >
    Kubernetes clusters, namespaces, ingress controllers, and API gateways
    registered through the Backstage Scaffolder. Managed by the addcluster backend plugin.
  tags:
    - kubernetes
    - infrastructure
    - platform
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
