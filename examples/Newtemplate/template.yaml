apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: my-new-template
  title: Custom Plugin & GitHub Service Template
  description: Scaffolds a new service component, creates a GitHub repository, and enables custom plugin integrations (App Manager, RBAC, GitLab).
  tags:
    - github
    - custom-plugins
    - nodejs
    - recommended

spec:
  owner: user:guest
  type: service
  parameters:
    - title: Component Information
      required:
        - name
        - owner
        - description
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: A short description of the component
          default: "Service component with custom plugin integrations"
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
    - title: Custom Plugin Integrations
      properties:
        enableAppManager:
          title: Enable App Manager Plugin
          type: boolean
          default: true
          description: Adds App Manager annotations and backend integration configuration
        enableRbac:
          title: Enable RBAC Access Control
          type: boolean
          default: true
          description: Configures Role-Based Access Control policies for this service
        enableGitlab:
          title: Enable GitLab Annotations & CI/CD
          type: boolean
          default: false
          description: Adds GitLab project annotations for source linking and pipeline monitoring
    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Select target GitHub organization and repository name
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          enableAppManager: ${{ parameters.enableAppManager }}
          enableRbac: ${{ parameters.enableRbac }}
          enableGitlab: ${{ parameters.enableGitlab }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: "main"
        protectDefaultBranch: false

    - id: register
      name: Register Component in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: notify
      name: Send Notification
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: "Repository and Component Created Successfully"
        info: "Your repository '${{ parameters.name }}' has been created on GitHub and registered in Backstage."
        severity: "normal"

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View Component in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
